[project]
name = "drc"
version = "0.1.0"
description = "Dog Research Capital: quant research and paper-trading stack"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.4",
    "orjson>=3.10",
    "polars>=2.0.0",
    "sortedcontainers>=2.4.0",
    "websockets>=13",
    "zstandard>=0.23",
]

[project.scripts]
drc-record = "drc.recorder.cli:main"
drc-normalize = "drc.normalize.cli:main"
drc-bars = "drc.market.build:main"
drc-backtest = "drc.backtest.cli:main"
drc-backfill = "drc.backfill.cli:main"
drc-sync = "drc.sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
