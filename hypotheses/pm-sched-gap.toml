id = "pm-sched-gap"
aliases = ["scheduled-end gap", "pm-sched-gap-v1"]
title = "Polymarket contracts priced 5-60c within days of the scheduled end are underpriced"
kind = "edge"
status = "testing"
proposed = 2026-10-23
updated = 2026-10-25
origin = "docs/findings/2026-10-23-scheduled-calibration.md"
findings = [
    "docs/findings/2026-10-23-scheduled-calibration.md",
    "docs/findings/2026-10-25-forward-session-1.md",
    "docs/findings/2026-11-06-multiple-testing.md",
]
rule = """
Net-of-cost rule (committed before running, 2026-10-25, `scheduled_net_study`): buy Yes on every
contract priced 5-60c at the horizon (days before the scheduled end) and hold to resolution.
Cost = the market's own stated fee (rate x (p(1-p))^exponent, 0 where fees are off) plus an
assumed half-spread. Primary: holdout, 3-day horizon, 1c half-spread; survives only if the 95%
CI lower bound is above 0. Universe: resolved binary markets, total volume >= $50k, scheduled
end 2024-01-01 .. 2026-09-01; discovery < 2026-02-09 <= holdout.
"""
rule_frozen = true
kill_criterion = """
Backtest: holdout 3d net at 1c half-spread has CI lower bound <= 0 (did not happen). Forward
test (fund pm-sched-gap-v1): the charter's own pre-declared evaluation, judged with depth-aware
pessimistic fills.
"""
notes = """
Pre-declared primary passed on the holdout. Open threats: spreads/depth in the quiet universe
(forward session 1: mean half-spread 1.13c, median depth at best ask ~$45 on 91 tokens), the
hindsight $50k total-volume filter, last trade is not the ask, capacity, and no mechanism
story. The pooled 5-60c row was the pre-declared headline of the calibration study, but no
numeric holdout threshold was written, so the holdout pooled rows are recorded as secondary
(replication), not primary. The net rule was frozen on 2026-10-25, two days AFTER the holdout
gross gap (+2.8 pts at 3d) had been seen, and net = gross - fee - assumed spread; so the
'primary' net test is not an independent confirmation, it restates the holdout replication
under a cost assumption. The genuinely out-of-sample evidence is the holdout pooled rows. Net rows at different half-spreads are the same trades shifted by a
constant, so they are not independent tests; counting them all inflates m (conservative).
"""

[search]
unrecorded_looks = 103
note = """
Approximate, counted generously: first-pass discovery pooled rows (6, superseded by the grown
set), volume-tier checks (3 tiers x 3d/7d x discovery/holdout = 12), net price-band splits
(4 bands x 3 horizons = 12), fee-free split (1), scheduled-end months (7), the other discovery
net cells (11), and the holdout calibration bins (9 bins x 6 horizons = 54).
"""

