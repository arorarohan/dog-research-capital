id = "pm-general-lookahead"
title = "Polymarket general markets priced 5-60c win 3-8 pts more often than price (first look)"
kind = "edge"
status = "killed"
proposed = 2026-10-22
updated = 2026-10-23
origin = "docs/findings/2026-10-22-first-look.md"
findings = [
    "docs/findings/2026-10-22-first-look.md",
    "docs/findings/2026-10-23-early-close-lookahead.md",
]
rule = """
Calibration of the 3,000 largest resolved Polymarket Yes/No markets at 1/3/7/14/30 days before
close: contracts priced 5-60c are underpriced (pooled gap > 0).
"""
rule_frozen = false
kill_criterion = """
(Written after the fact.) The effect disappears when horizons are anchored to the scheduled end
date and the universe is fixed in advance.
"""
notes = """
An artifact of our own design: horizons were measured from the realized close, which leaks the
outcome (35% of markets closed early because the event happened). The universe ('largest by
volume') was also chosen with hindsight. Superseded by pm-sched-gap. Kept so the count of looks
stays honest.
"""

[search]
unrecorded_looks = 52
note = """
Pooled rows at the other 4 horizons (CIs excluded 0; per-horizon numbers not written down),
the ran-to-schedule / closed-early splits at 14d and 3d (4, reported without CIs: -3.2 / +24.4,
+2.2 / +17.6) and ~44 calibration bins (5 horizons x 9 bins, minus the pooled view).
"""

[[tests]]
id = "pooled-5-60c-by-year"
date = 2026-10-22
role = "exploratory"
data = "3,000 largest resolved markets, horizons from realized close (flawed anchor)"
metric = "pooled gap, pts"
direction = "positive"
result = "descriptive"
reported = { gap_2024_pts = 12.6, gap_2025_pts = 8.8, gap_2026_pts = 7.2, gap_range_lo_pts = 3.0, gap_range_hi_pts = 8.0 }
note = "CIs excluded 0 at all five horizons; per-horizon numbers were not recorded in the finding."

[[tests]]
id = "split-7d-ran-to-schedule"
date = 2026-10-22
role = "diagnostic"
data = "same set, markets that ran to their scheduled end"
metric = "gap, pts"
direction = "positive"
estimate = 1.5
ci = [-2.1, 5.0]
result = "fail"

[[tests]]
id = "split-7d-closed-early"
date = 2026-10-22
role = "diagnostic"
data = "same set, markets that closed > 2 days early"
metric = "gap, pts"
direction = "either"
estimate = 26.0
ci = [17.7, 36.8]
result = "descriptive"
note = "A real in-sample effect, but it is the lookahead itself, not a tradeable mispricing."
